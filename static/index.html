<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>团队长会复盘器</title><style>
:root{--ink:#17211b;--muted:#68736c;--paper:#f5f3ec;--card:#fffefa;--green:#22634b;--line:#dddcd3;--amber:#bd6b2c}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{width:min(960px,calc(100% - 32px));margin:auto;padding:64px 0 96px}header{text-align:center;margin-bottom:32px}h1{font-size:clamp(34px,6vw,54px);line-height:1.1;margin:0 0 12px}header p,.muted,.privacy{color:var(--muted)}.panel,section{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px;margin-top:18px}.auth-row,.actions{display:flex;gap:12px;align-items:center}.auth-row input,.title-input{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit}.title-input{width:100%;margin-bottom:14px}.drop{display:block;border:1.5px dashed #aeb8b1;border-radius:16px;padding:36px 20px;text-align:center;cursor:pointer}.drop strong{display:block;font-size:18px}.drop span{color:var(--muted);font-size:14px}input[type=file]{position:absolute;opacity:0;pointer-events:none}button{border:0;border-radius:12px;background:var(--green);color:#fff;padding:12px 18px;font-weight:650;cursor:pointer}button:disabled{opacity:.45}.actions{justify-content:space-between;margin-top:16px}.privacy{font-size:13px}#status,#error,#authError,#longNotice{margin-top:15px;padding:12px 14px;border-radius:12px}#status,#longNotice{background:#edf4ef;color:var(--green)}#error,#authError{background:#fff0e8;color:#8c3a18}.hidden{display:none!important}.report-head{display:flex;justify-content:space-between;align-items:center}.report-head h2,section h3{margin:0}.report-head h2{font-size:30px}h4{margin:18px 0 8px}ul{margin:8px 0;padding-left:22px}.todo{width:100%;border-collapse:collapse}.todo th,.todo td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}blockquote{margin:10px 0;padding:10px 14px;border-left:3px solid var(--amber);background:#faf3ea}.time{color:var(--muted);font-size:12px;margin-left:8px}.history-item{width:100%;display:flex;justify-content:space-between;gap:16px;text-align:left;background:#f0f4ef;color:var(--ink);margin-top:10px}.secondary{background:#e5eee8;color:var(--green)}@media(max-width:600px){.actions,.report-head{align-items:stretch;flex-direction:column}.actions button,.report-head button{width:100%}}
</style></head><body><main>
<header><h1>团队长会复盘器</h1><p>把正式会议中的要点、决策与行动项沉淀为团队长期记忆。</p></header>
<div class="panel" id="authPanel"><p class="muted">请输入你的团队口令</p><div class="auth-row"><input id="accessToken" type="password" autocomplete="current-password" placeholder="请输入你的团队口令"><button id="authSubmit">验证口令</button></div><div id="authError" class="hidden" role="alert"></div></div>
<div class="panel hidden" id="uploadPanel"><input class="title-input" id="meetingTitle" maxlength="100" placeholder="会议标题（可选）"><label class="drop" id="dropZone" for="audioFile"><strong id="fileTitle">点击选择或拖入会议录音</strong><span id="fileMeta">支持 MP3 / M4A / WAV，最大 300 MB、60 分钟</span></label><input id="audioFile" type="file" accept=".mp3,.m4a,.wav,audio/mpeg,audio/mp4,audio/wav"><div class="actions"><span class="muted">面向产品项目组的连续内部会议，参会人数可随会议变化。</span><button id="submit" disabled>开始复盘</button></div><p class="privacy">音频转写完成后即删除；转写文本与报告仅保存在本服务器，按团队隔离，不会传给第三方；分析时文本会发送给运营方配置的 AI 服务</p><div id="longNotice" class="hidden"></div><div id="status" class="hidden" role="status"></div><div id="error" class="hidden" role="alert"></div></div>
<div class="panel hidden" id="historyPanel"><div class="report-head"><h2>会议历史</h2><button class="secondary" id="refreshHistory">刷新</button></div><div id="history"></div></div>
<div id="report" class="hidden"><div class="report-head"><h2 id="reportTitle">会议复盘报告</h2><button class="secondary" id="again">复盘另一场</button></div><section><h3>① 会议要点</h3><div id="points"></div></section><section><h3>② 决策清单</h3><div id="decisions"></div></section><section><h3>③ 行动项</h3><div id="actions"></div></section><section><h3>④ 发言统计</h3><p id="speakerStats"></p></section></div>
</main><script>
const $=id=>document.getElementById(id),el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n};let selectedFile=null,activeTaskId=null;const TASK_STORAGE_KEY='meeting-review-task-id',ACCESS_STORAGE_KEY='meeting-review-access-token',POLL_LIMIT_MS=15*60*1000;
function apiFetch(url,options={},token=localStorage.getItem(ACCESS_STORAGE_KEY)||''){const headers=new Headers(options.headers||{});headers.set('X-Access-Token',token);return window.fetch(url,{...options,headers,credentials:'omit'})}const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));const seconds=v=>{const n=Math.round(v||0);return `${Math.floor(n/60)} 分 ${n%60} 秒`};
function choose(file){selectedFile=file||null;$('submit').disabled=!selectedFile||!!activeTaskId;$('fileTitle').textContent=selectedFile?selectedFile.name:'点击选择或拖入会议录音';$('fileMeta').textContent=selectedFile?`${(selectedFile.size/1024/1024).toFixed(1)} MB`:'支持 MP3 / M4A / WAV，最大 300 MB、60 分钟'}
$('audioFile').addEventListener('change',e=>choose(e.target.files[0]));['dragenter','dragover','dragleave','drop'].forEach(name=>$('dropZone').addEventListener(name,e=>e.preventDefault()));$('dropZone').addEventListener('drop',e=>choose(e.dataTransfer.files[0]));
function table(parent,headers,rows){parent.replaceChildren();if(!rows.length){parent.append(el('p','暂无'));return}const t=el('table',undefined,'todo'),h=el('tr');headers.forEach(x=>h.append(el('th',x)));t.append(h);rows.forEach(values=>{const r=el('tr');values.forEach(x=>r.append(el('td',x)));t.append(r)});parent.append(t)}
function render(report,title='会议复盘报告'){$('reportTitle').textContent=title;const p=$('points');p.replaceChildren();const list=el('ul');(report.meeting_points.length?report.meeting_points:['暂无']).forEach(x=>list.append(el('li',x)));p.append(list);const d=$('decisions');d.replaceChildren();if(!report.decisions.length)d.append(el('p','暂无'));report.decisions.forEach((item,i)=>{const box=el('article');box.append(el('h4',`${i+1}. ${item.content}`),el('p',`决策人：${item.decision_maker}`));const q=el('blockquote',`“${item.evidence.quote}”`);q.append(el('span',item.evidence.timestamp,'time'));box.append(q);d.append(box)});table($('actions'),['任务','负责人','截止时间'],report.action_items.map(x=>[x.task,x.owner,x.deadline]));$('speakerStats').textContent=report.speaker_stats_note;$('report').classList.remove('hidden');$('report').scrollIntoView({behavior:'smooth'})}
function showAuth(message=''){$('authPanel').classList.remove('hidden');$('uploadPanel').classList.add('hidden');$('historyPanel').classList.add('hidden');$('authError').textContent=message;$('authError').classList.toggle('hidden',!message)}
async function loadHistory(){const response=await apiFetch('/api/meetings',{cache:'no-store'});if(!response.ok)return;const meetings=await response.json(),box=$('history');box.replaceChildren();if(!meetings.length)box.append(el('p','暂无历史会议','muted'));meetings.forEach(item=>{const b=el('button',undefined,'history-item');b.append(el('span',item.title),el('span',`${new Date(item.created_at).toLocaleString()} · ${seconds(item.duration_seconds)}`));b.addEventListener('click',()=>openHistory(item.id));box.append(b)})}
async function openHistory(id){const response=await apiFetch(`/api/meetings/${encodeURIComponent(id)}`);const body=await response.json();if(!response.ok){showError(body.detail||'历史报告读取失败');return}render(body.report,body.title)}
function showApp(){$('authPanel').classList.add('hidden');$('uploadPanel').classList.remove('hidden');$('historyPanel').classList.remove('hidden');loadHistory();const saved=localStorage.getItem(TASK_STORAGE_KEY);if(saved&&!activeTaskId){activeTaskId=saved;$('submit').disabled=true;pollTask(saved)}}
async function verifyAccess(token){try{const response=await apiFetch('/api/auth/check',{cache:'no-store'},token);if(!response.ok)return false;localStorage.setItem(ACCESS_STORAGE_KEY,token);showApp();return true}catch{return false}}
async function submitAccess(){const token=$('accessToken').value.trim();$('authSubmit').disabled=true;const ok=await verifyAccess(token);$('authSubmit').disabled=false;if(!ok){localStorage.removeItem(ACCESS_STORAGE_KEY);showAuth('团队口令错误，请重新输入')}}$('authSubmit').addEventListener('click',submitAccess);$('accessToken').addEventListener('keydown',e=>{if(e.key==='Enter')submitAccess()});
function showError(message){$('error').textContent=message;$('error').classList.remove('hidden')}
function showStatus(task){const copy={'上传完成':'上传完成，正在进入处理队列…','转写中':'正在转写，长会议可能需要较长时间…','AI 分析中':'转写完成，正在进行 AI 分析…'};$('status').textContent=task.status==='排队中'?`排队中，前面还有 ${task.queue_position} 人`:(copy[task.status]||task.message||task.status);$('status').classList.remove('hidden');if(task.long_meeting){$('longNotice').textContent='长会议处理较久，你可以先关掉页面，完成后报告会保存在历史记录里';$('longNotice').classList.remove('hidden')}}
function finishTask(){activeTaskId=null;localStorage.removeItem(TASK_STORAGE_KEY);$('status').classList.add('hidden');$('submit').disabled=!selectedFile;loadHistory()}
async function pollTask(id){let failures=0,deadline=Date.now()+POLL_LIMIT_MS;while(activeTaskId===id){if(Date.now()>=deadline){activeTaskId=null;$('status').classList.add('hidden');$('submit').disabled=!selectedFile;showError('处理时间较长，请稍后刷新重试');return}try{const response=await apiFetch(`/api/tasks/${encodeURIComponent(id)}`,{cache:'no-store'}),body=await response.json();if(response.status===403){activeTaskId=null;localStorage.removeItem(ACCESS_STORAGE_KEY);showAuth('团队口令已失效，请重新验证');return}if(!response.ok)throw new Error(body.detail||`状态查询失败（${response.status}）`);failures=0;showStatus(body);if(body.status==='完成'){finishTask();render(body.report);return}if(body.status==='失败'){finishTask();showError(body.error||body.message||'处理失败，请重试');return}}catch(error){if(++failures>=5){finishTask();showError(error.message||'无法查询任务状态');return}}await sleep(2000)}}
$('submit').addEventListener('click',async()=>{if(!selectedFile||activeTaskId)return;$('submit').disabled=true;$('error').classList.add('hidden');$('report').classList.add('hidden');const data=new FormData();data.append('file',selectedFile);data.append('title',$('meetingTitle').value);try{const response=await apiFetch('/api/review',{method:'POST',body:data}),body=await response.json();if(response.status===403){localStorage.removeItem(ACCESS_STORAGE_KEY);showAuth('团队口令已失效，请重新验证');throw new Error('团队口令错误')}if(!response.ok)throw new Error(body.detail||`请求失败（${response.status}）`);activeTaskId=body.task_id;localStorage.setItem(TASK_STORAGE_KEY,activeTaskId);showStatus(body);await pollTask(activeTaskId)}catch(error){if(!activeTaskId){$('submit').disabled=false;showError(error.message||'提交失败，请重试')}}});
$('again').addEventListener('click',()=>{$('report').classList.add('hidden');$('uploadPanel').scrollIntoView({behavior:'smooth'})});$('refreshHistory').addEventListener('click',loadHistory);verifyAccess(localStorage.getItem(ACCESS_STORAGE_KEY)||'').then(ok=>{if(!ok)showAuth()});
</script></body></html>
