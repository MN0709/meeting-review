[project]
name = "meeting-review"
version = "0.3.0"
description = "会脉 · 团队会议记忆：上传会议录音，看清决定了什么、谁承诺了什么、还有什么没解决"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
# 依赖以 requirements*.txt 为唯一来源（本仓库不开 src 布局，也不走 pip install .）。
#   requirements.txt      运行所需（含开发期 lint 工具）
#   requirements-ci.txt   CI 专用轻量集合（见下方注释）
#   requirements.lock     完整环境快照，用于同平台复现
dependencies = []

[project.optional-dependencies]
# lint 工具单列，便于本地只装它。
dev = ["ruff>=0.14,<1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 保持与现有命令一致的简洁输出。
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py39"
exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    # E501 在本项目里几乎全部命中 llm.py 的 system prompt 字面量与中文用户提示语。
    # 换行会改变 prompt 内容，而本轮禁止改动任何 Prompt（见第 2 阶段技术开发文档第八节）。
    # 其余 F/E4/E7/E9 类问题（未定义名、未使用导入、语法隐患）仍然强制检查。
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# 测试里含很长的 JSON fixture 字面量，属于可读性选择。
"tests/*" = ["E501"]
